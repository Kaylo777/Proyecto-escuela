# Configuracion compartida (aplicada a todos los microservicios)
#
# Spring Security + JWT:
#   - El gateway es el AUTORIZADOR: valida el token, emite el access token y el
#     refresh token.
#   - Los microservicios son RESOURCE SERVERS: validan el mismo token con el
#     mismo secreto, para que ningun servicio pueda esquivar al gateway
#     entrando directamente por su puerto.
#   - Por eso el secreto y el emisor (issuer) viven aqui, en el Config Server:
#     todos los servicios leen exactamente los mismos valores.
app:
  jwt:
    # Secreto de firma de los ACCESS tokens (HS256). Minimo 32 caracteres.
    secret: clave-de-firma-access-token-colegio-microservicios-2026-seguro
    # Secreto DISTINTO para los refresh tokens. Gracias a esto un refresh token
    # no puede usarse como access token (y al reves) porque cada tipo se firma
    # y se valida con una clave diferente.
    refresh-secret: clave-de-firma-refresh-token-colegio-microservicios-2026-seguro
    # Emisor del token: se valida en todos los servicios (evita tokens de otra app).
    issuer: colegio-microservicios
    # Duracion del access token: 15 minutos (900000 ms).
    expiration: 900000
    # Duracion del refresh token: 8 horas (28800000 ms).
    refresh-expiration: 28800000
  security:
    # Cuenta de solo monitoreo (Spring Boot Admin). Permite leer los endpoints
    # /actuator/** de cualquier servicio por HTTP Basic. La contrasena esta en
    # BCrypt, nunca en texto plano.
    monitoring:
      username: monitor
      password: "{bcrypt}$2a$10$bp3Rl8zJX0JTIDGf9qy0L.zP9Mx0HjmmXAoQUggKKjui60LLB/KzO"
      roles: [ ADMIN ]

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.value}
    # Registrar la IP en vez del hostname. Sin esto, Eureka publica el nombre del
    # equipo (p.ej. KAYLO777.mshome.net) y el load balancer del gateway no lo
    # resuelve: falla con NXDOMAIN y todo /api/** responde 500. Pasa en cualquier
    # Windows donde el nombre de equipo no sea un nombre DNS valido, y tambien
    # cuando hay adapters virtuales (WSL/Docker/Hyper-V) que chooses mal la IP.
    prefer-ip-address: true

management:
  endpoints:
    web:
      # Spring Boot Admin necesita estos endpoints para mostrar estado, metricas
      # y logs. No son publicos: exigen ROLE_ADMIN (ver SecurityConfig de cada
      # servicio), salvo /actuator/health e /actuator/info.
      exposure:
        include: health,info,env,beans,configprops,loggers,httptrace,threaddump,metrics,sessions
  endpoint:
    health:
      show-details: always
