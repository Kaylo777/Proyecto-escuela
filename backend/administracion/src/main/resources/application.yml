server:
  port: 8102

spring:
  application:
    name: administracion
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:file:./data/administracion
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Respaldo por si el Config Server no esta levantado. La fuente de verdad es
# config-server/.../config/application.yml: el secreto y el emisor deben ser
# identicos a los del gateway para que este servicio valide sus tokens.
app:
  jwt:
    secret: clave-de-firma-access-token-colegio-microservicios-2026-seguro
    issuer: colegio-microservicios
  security:
    monitoring:
      username: monitor
      password: "{bcrypt}$2a$10$bp3Rl8zJX0JTIDGf9qy0L.zP9Mx0HjmmXAoQUggKKjui60LLB/KzO"
      roles: [ ADMIN ]

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,configprops,metrics